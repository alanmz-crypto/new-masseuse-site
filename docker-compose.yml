name: new-masseuse-site

# Image digests pinned 2026-09-27 so rebuilds resolve the same bits a tag
# could later point away from. Re-pin deliberately with:
#   docker buildx imagetools inspect <name:tag>
# wordpress/wpcli retagged 2026-09-28 from :latest/:cli to :php8.3-apache/
# :cli-php8.3 -- same exact digest, same bits, only the tag now states the PHP
# version so scripts/practice-image-parity.sh can verify it against the
# recorded practice_php value instead of refusing a version-agnostic tag.
# wordpress/wpcli re-pinned 2026-09-28 to php8.2 tags to match thaisolitude.com
# PHP (8.2.34); see scripts/practice-image-parity.sh and
# scripts/practice-expected-php.txt for the parity check this closes.
# wordpress/wpcli re-pinned 2026-10-17 to php8.5 tags (both PHP 8.5.11) because
# thaisolitude.com moved 8.2 -> 8.3 -> 8.5.11 on 2026-10-16. Digests were read
# from the registry and the PHP_VERSION of each pulled image was checked.
services:
  db:
    image: mariadb:10.6@sha256:40153feb479c0da88b5cfe3f50f44c91f7baf05a1b7bcc5beb7eb37a890a8f16
    container_name: new-masseuse-db-1
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: newrootpassword
      MYSQL_DATABASE: new_masseuse_db
      MYSQL_USER: new
      MYSQL_PASSWORD: newpassword
    volumes:
      - new_masseuse_db_data:/var/lib/mysql

  wordpress:
    image: wordpress:php8.5-apache@sha256:c12bed9c5af9d76261221c2af3a6216a074dd80b4fc2459588b3cbf2dd8e1798
    container_name: new-masseuse-wordpress-1
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:80"
    depends_on:
      - db
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: new_masseuse_db
      WORDPRESS_DB_USER: new
      WORDPRESS_DB_PASSWORD: newpassword
    volumes:
      - ./public_html:/var/www/html

  wpcli:
    image: wordpress:cli-php8.5@sha256:52d8832dc8b90022c22fe963e696e4107d86f68b9b891e9624d82fec94fdc3b7
    container_name: new-masseuse-wpcli
    depends_on:
      - db
      - wordpress
    volumes:
      - ./public_html:/var/www/html
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: new_masseuse_db
      WORDPRESS_DB_USER: new
      WORDPRESS_DB_PASSWORD: newpassword

volumes:
  new_masseuse_db_data:
